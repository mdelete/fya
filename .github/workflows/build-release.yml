
name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - run: cargo build --release
      - run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: fya-${{ matrix.target }}
          path: target/release/fya${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_id }}-${{ github.run_attempt }}
          name: FYA Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/fya-windows-x64/fya.exe
            release-assets/fya-macos/fya
            release-assets/fya-linux/fya
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
