name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            asset: fya.exe
          - os: macos-latest
            target: macos
            asset: FYA.app.zip
          - os: ubuntu-latest
            target: linux
            asset: fya-linux

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - run: cargo test --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cp target/release/fya fya-linux

      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-macos.sh
          ditto -c -k --sequesterRsrc --keepParent target/FYA.app FYA.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fya-${{ matrix.target }}
          path: ${{ runner.os == 'Windows' && 'target/release/fya.exe' || matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show assets
        run: ls -l release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_id }}-${{ github.run_attempt }}
          name: FYA Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/fya.exe
            release-assets/FYA.app.zip
            release-assets/fya-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
